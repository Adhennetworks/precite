name: CI

on:
  push:
    branches: ["**"]         # toutes les branches
  pull_request:
    branches: [main]
  workflow_dispatch:          # pour lancer les live manuellement

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Test transforms (script)
        run: python scripts/test_transforms.py

      - name: Unit + integration tests
        run: pytest tests/ -m "not live and not quality" -v --cov=precite --cov-report=term-missing

  live:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Live API tests (staging only)
        env:
          PRECITE_API_URL: ${{ vars.PRECITE_STAGING_URL }}
        run: pytest tests/live -m live -v