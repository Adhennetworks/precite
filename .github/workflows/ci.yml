name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:        # ← debloque le job live

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Test transforms (script)
        run: python scripts/test_transforms.py

      - name: Unit + integration tests
        # addopts exclut deja live et quality, mais on le rend explicite
        run: pytest tests/ -m "not live and not quality" -v --cov=precite --cov-report=term-missing

  live:
    if: github.event_name == 'workflow_dispatch'
    needs: test              # les live ne tournent que si unit+integration passent
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Live API tests (staging only)
        env:
          # Defini dans Settings > Variables > Actions > PRECITE_STAGING_URL
          # Si absent, les tests skip automatiquement
          PRECITE_API_URL: ${{ vars.PRECITE_STAGING_URL }}
        run: pytest tests/live -m live -v