name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:        # ← ajoute ca, sinon les live sont dead code

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Test transforms (script)
        run: python scripts/test_transforms.py

      - name: Unit + integration tests
        run: pytest tests/ -m "not live" -v --cov=precite --cov-report=term-missing

  live:
    if: github.event_name == 'workflow_dispatch'
    needs: test              # les live ne tournent que si unit+integration passent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Live API tests (staging only)
        env:
          PRECITE_API_URL: ${{ vars.PRECITE_STAGING_URL }}   # ← variable, pas en dur
        run: pytest tests/live -m live -v