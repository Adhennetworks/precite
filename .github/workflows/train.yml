name: Annual Retrain

on:
  schedule:
    # 1er juillet de chaque année à 3h UTC
    - cron: "0 3 1 7 *"
  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 500

    env:
      MLFLOW_ALLOW_FILE_STORE: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -e ".[train]"
          pip install huggingface_hub duckdb

      - name: Compute current year
        id: year
        run: |
          echo "current=$(date +%Y)" >> $GITHUB_OUTPUT

      - name: Download latest data from HF
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python scripts/download_from_hf.py \
            --source preciteproject/precite-data \
            --target data

      - name: Download MLflow models from HF
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          from huggingface_hub import snapshot_download
          import os
          snapshot_download(
              'preciteproject/precite-models',
              repo_type='model',
              local_dir='.',
              token=os.environ['HF_TOKEN'],
          )
          "

      - name: Retrain yearly models (LM + NB)
        run: |
          echo "=== Training yearly models up to ${{ steps.year.outputs.current }} ==="
          python scripts/train_yearly_models.py \
            --model-type lm \
            --start 1985 \
            --end ${{ steps.year.outputs.current }}
          python scripts/train_yearly_models.py \
            --model-type nb \
            --start 1985 \
            --end ${{ steps.year.outputs.current }}

      - name: Retrain production models
        run: |
          echo "=== Training production models (target complete = n-3) ==="
          python scripts/train_production_models.py --all

      - name: Retrain DLE horizon models
        run: |
          python scripts/train_dle_horizon.py --family lm --all
          python scripts/train_dle_horizon.py --family nb --all

      - name: Predict on all articles
        env:
          PRECITE_MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        run: |
          python scripts/predict_all.py --batch-id annual-${{ github.run_id }} --model-family lm --skip-papers
          python scripts/predict_all.py --batch-id annual-${{ github.run_id }} --model-family nb --skip-papers
          python scripts/compact_predictions.py

      - name: Upload predictions to HF
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python scripts/upload_to_hf.py \
            --target preciteproject/precite-data \
            --root data \
            --skip-papers \
            --skip-features

      - name: Upload MLflow models to HF
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python scripts/upload_mlflow_to_hf.py

      - name: Notify success
        if: success()
        run: echo "✅ Retrain annuel terminé"