name: Annual Retrain

on:
  # 1er juillet de chaque annee a 3h UTC
  schedule:
    - cron: "0 3 1 7 *"
  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 500

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -e ".[train]"
          pip install huggingface_hub duckdb

      - name: Download latest features from HF
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python scripts/download_from_hf.py \
            --source precite/features \
            --target data/final

      - name: Retrain all models (LM + NB + DLE)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PRECITE_MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        run: |
          python scripts/train_yearly_models.py --model-type lm --start 1985 --end 2025 --window 5
          python scripts/train_yearly_models.py --model-type nb --start 1985 --end 2025 --window 5
          python scripts/train_production_models.py --all
          python scripts/train_dle_horizon.py --family lm --all
          python scripts/train_dle_horizon.py --family nb --all

      - name: Run predictions on all articles
        env:
          PRECITE_MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        run: |
          python scripts/predict_all.py --batch-id annual-${{ github.run_id }} --model-family lm --skip-papers
          python scripts/predict_all.py --batch-id annual-${{ github.run_id }} --model-family nb --skip-papers
          python scripts/compact_predictions.py

      - name: Upload predictions to HF
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python scripts/upload_to_hf.py --source data/predictions --target precite/predictions

      - name: Notify success
        if: success()
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          custom_payload: |
            {
              "text": "Retrain annuel termine avec succes"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}