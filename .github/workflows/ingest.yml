name: Ingest PubMed

on:
  schedule:
    # Tous les jours à 5h UTC (après la mise à jour NCBI ~4h UTC)
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Forcer la ré-ingestion"
        type: boolean
        default: false
      reingest_from:
        description: "Nom du fichier PubMed de départ (ex: pubmed26n1400.xml.gz). Vide = normal"
        type: string
        default: ""

jobs:
  check-and-ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 350  # 5h50 max

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[train]"
          pip install huggingface_hub duckdb

      - name: Restore PubMed state
        uses: actions/cache@v4
        with:
          path: data/.state
          key: pubmed-state-${{ github.run_id }}
          restore-keys: |
            pubmed-state-

      - name: Detect PubMed update
        id: detect
        env:
          REINGEST_FROM: ${{ github.event.inputs.reingest_from }}
        run: python scripts/detect_pubmed_update.py

      - name: Check for update
        id: check
        run: |
          if [ "${{ steps.detect.outputs.has_update }}" = "true" ]; then
            echo "update=true" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "update=true" >> $GITHUB_OUTPUT
          else
            echo "update=false" >> $GITHUB_OUTPUT
          fi

      - name: Download existing data from HF
        if: steps.check.outputs.update == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python scripts/download_from_hf.py \
            --source preciteproject/precite-data \
            --target data

      - name: Download MLflow store from HF
        if: steps.check.outputs.update == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          from huggingface_hub import snapshot_download
          import os
          snapshot_download(
              'preciteproject/precite-models',
              repo_type='model',
              local_dir='.',
              token=os.environ['HF_TOKEN'],
          )
          "

      - name: Ingest new files
        if: steps.check.outputs.update == 'true'
        run: python scripts/ingest_new_files.py

      - name: Consolidate features into chunks
        if: steps.check.outputs.update == 'true'
        run: python scripts/merge_enriched.py

      - name: Rebuild papers API view
        if: steps.check.outputs.update == 'true'
        run: python scripts/rebuild_papers.py

      - name: Memory check
        if: steps.check.outputs.update == 'true'
        run: free -h
      - name: Debug MLflow artifacts
        if: steps.check.outputs.update == 'true'
        run: |
          echo "CWD: $(pwd)"
          echo ""
          echo "mlflow.db present:"
          ls -la mlflow.db
          echo ""
          echo "mlartifacts present:"
          ls -la mlartifacts/ 2>&1 | head -3
          echo ""
          echo "Artefact specifique:"
          ls -la mlartifacts/438f21a335d54b6c837d73dd4c7852c3/artifacts/model/ 2>&1 | head -10
          echo ""
          echo "Recherche MLmodel:"
          find mlartifacts -name "MLmodel" 2>&1 | head -5        
      - name: Predict LM (only new)
        if: steps.check.outputs.update == 'true'
        env:
          MLFLOW_TRACKING_URI: "sqlite:///mlflow.db"
          MLFLOW_ALLOW_FILE_STORE: "true"
        run: |
          python scripts/predict_all.py \
            --source data/features \
            --batch-id ingest-${{ github.run_id }}-lm \
            --model-family lm \
            --skip-papers \
            --only-new

      - name: Predict NB (only new)
        if: steps.check.outputs.update == 'true'
        env:
          MLFLOW_TRACKING_URI: "sqlite:///mlflow.db"
          MLFLOW_ALLOW_FILE_STORE: "true"
        run: |
          python scripts/predict_all.py \
            --source data/features \
            --batch-id ingest-${{ github.run_id }}-nb \
            --model-family nb \
            --skip-papers \
            --only-new

      - name: Verify no duplicates
        if: steps.check.outputs.update == 'true'
        run: python scripts/verify_no_dupes.py

      - name: Upload features + predictions to HF
        if: steps.check.outputs.update == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python scripts/upload_to_hf.py \
            --target preciteproject/precite-data \
            --root data

      - name: Save PubMed state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/.state
          key: pubmed-state-${{ github.run_id }}

      - name: Notify failure
        if: failure()
        run: |
          echo "Ingestion a echoue. Verifier les logs."