name: Drift Monitoring

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install --upgrade pip
          pip install --no-cache-dir "pandas>=2.2,<3.0" "evidently==0.7.23" duckdb pyarrow huggingface_hub mlflow scipy
      - name: Download features from HF
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/download_from_hf.py --source preciteproject/precite-data --target data
      - name: Download MLflow store from HF
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          from huggingface_hub import snapshot_download
          import os
          snapshot_download('preciteproject/precite-models', repo_type='model', local_dir='.', token=os.environ['HF_TOKEN'])
          "
      - name: Run drift detection
        env:
          MLFLOW_TRACKING_URI: "sqlite:///mlflow.db"
          MLFLOW_ALLOW_FILE_STORE: "true"
          DRIFT_SHARE_WARN: "0.7"
          DRIFT_SHARE_CRIT: "0.9"
        run: python scripts/drift_monitor.py
      - name: Upload drift report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: data/drift_report.json
          if-no-files-found: warn
      - name: Upload MLflow store to HF
        if: always()
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          from huggingface_hub import HfApi
          import os
          api = HfApi()
          api.upload_file(path_or_fileobj='mlflow.db', path_in_repo='mlflow.db', repo_id='preciteproject/precite-models', repo_type='model', token=os.environ['HF_TOKEN'])
          print('MLflow store uploaded')
          "