name: Drift Monitoring

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install minimal dependencies (isolated)
        run: |
          python -m pip install --upgrade pip
          # Pas de pip install -e ".[train]" — on isole les deps de drift
          pip install duckdb pyarrow pandas huggingface_hub
          pip install --no-cache-dir "evidently==0.7.23"

      - name: Check versions
        run: |
          python -c "import pandas; print('pandas:', pandas.__version__)"
          python -c "import evidently; print('evidently:', evidently.__version__)"

      - name: Download features from HF
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python scripts/download_from_hf.py \
            --source preciteproject/precite-data \
            --target data

      - name: Run drift detection
        run: python scripts/drift_monitor.py --days 7

      - name: Upload drift report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: data/drift_report.json