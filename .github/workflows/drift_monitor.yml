name: Drift Monitoring

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install isolated dependencies (pandas 2 + evidently)
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir "pandas>=2.2,<3.0" "evidently==0.7.23" duckdb pyarrow huggingface_hub

      - name: Check versions
        run: |
          python -c "import pandas; print('pandas:', pandas.__version__)"
          python -c "import evidently; print('evidently:', evidently.__version__)"

      - name: Download features from HF
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python scripts/download_from_hf.py \
            --source preciteproject/precite-data \
            --target data

      - name: Run drift detection (vs training sample)
        env:
          DRIFT_SHARE_WARN: "0.7"
          DRIFT_SHARE_CRIT: "0.9"
        run: python scripts/drift_monitor.py

      - name: Upload drift report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: data/drift_report.json
          if-no-files-found: warn

      - name: Upload drift report to HF
        if: always()
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -f data/drift_report.json ]; then
            python -c "
          from huggingface_hub import HfApi
          import os
          api = HfApi()
          api.upload_file(
              path_or_fileobj='data/drift_report.json',
              path_in_repo='drift_report.json',
              repo_id='preciteproject/precite-data',
              repo_type='dataset',
              token=os.environ['HF_TOKEN'],
          )
          print('Drift report uploaded to HF')
          "
          else
            echo "::warning::Pas de rapport à uploader"
          fi