[project]
name = "precite"
version = "0.1.0"
description = "Citation prediction from pre-submission features, mitigating the Matthew effect"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Adhen Benlahlou" },
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "lxml>=5.2",
    "pyarrow>=16.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "boto3>=1.34",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "tenacity>=8.3",
    "structlog>=24.1",
    "huggingface_hub>=0.20",
    "duckdb>=1.0",
]

[project.optional-dependencies]
train = [
    "statsmodels>=0.14",
    "scikit-learn>=1.4",
    "mlflow>=2.14",
    "psutil>=5.9",
]
explain = ["shap>=0.45"]
monitor = ["nannyml>=0.11"]
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "duckdb>=1.0",
    "huggingface_hub>=0.24",
]
dev = ["pytest>=8.0", "pytest-cov", "ruff>=0.5", "mypy>=1.10", "pre-commit"]

[project.scripts]
precite = "precite.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/precite"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501",
        "B008",   
        ]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: tests unitaires rapides (< 100ms)",
    "integration: tests d'integration (I/O local, < 5s)",
    "quality: tests de qualite de donnees (sur les vrais chunks, lents)",
    "live: tests contre l'API deployee (necessite reseau)",
]
addopts = "-q --strict-markers"